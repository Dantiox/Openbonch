name: Openbonch Multiplatform CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Сборка Linux, Android и кросс-таргетов
  build-linux:
    name: Build Linux & Cross-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --target ${{ matrix.target }} --release
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: openbonch-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/openbonch

  # Сборка macOS (Universal: Apple Silicon M1-M4 + Intel)
  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
      - name: Build Apple Silicon and Intel
        run: |
          cargo build --target aarch64-apple-darwin --release
          cargo build --target x86_64-apple-darwin --release
          mkdir -p dist
          lipo -create -output dist/openbonch-macos-universal \
            target/aarch64-apple-darwin/release/openbonch \
            target/x86_64-apple-darwin/release/openbonch
      - name: Upload macOS Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: openbonch-macos-universal
          path: dist/openbonch-macos-universal

  # Сборка Windows (x86_64-pc-windows-msvc)
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows
        run: cargo build --target x86_64-pc-windows-msvc --release
      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: openbonch-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/openbonch.exe
