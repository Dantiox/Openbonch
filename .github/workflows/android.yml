name: Build Openbonch Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Openbonch APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Rename APK for Distribution
        run: |
          mkdir -p dist
          find android -name "*debug.apk" -exec cp {} dist/Openbonch-debug.apk \;
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Openbonch-Android-APK
          path: dist/Openbonch-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.1.0-preview
          name: "Openbonch v0.1.0 (Android APK Preview)"
          body: |
            ## Openbonch Android APK (Предварительная сборка)

            * 📱 Нативное приложение для студентов СПбГУТ на Jetpack Compose (Material 3).
            * ⚡ Вход по логину/паролю или без пароля (по cookie `miden`).
            * 🛡️ Шифрование кредов в аппаратном Android KeyStore.
            * 🔄 Фоновая служба автоотметки (Foreground Service).
            * 🚫 100% бесплатно, без рекламы и подписок.
          files: dist/Openbonch-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
