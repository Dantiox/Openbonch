name: Build Openbonch Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Openbonch APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate and Rename APK for Distribution
        run: |
          mkdir -p dist
          find android -name "*debug.apk" -exec cp {} dist/Openbonch-debug.apk \;
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Openbonch-Android-APK
          path: dist/Openbonch-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.2.0-preview
          name: "Openbonch v0.2.0 (Расписание, Навигатор кампуса и Автоотметка)"
          body: |
            ## Openbonch Android APK v0.2.0

            ### 🚀 Что нового:
            * 📅 **Интерактивное расписание занятий** (вкладка "Пары"):
              * Дни недели (Пн-Сб) со списком пар и временными слотами.
              * Поддержка ручной отметки в один тап прямо из карточки пары при появлении кнопки «Начать занятие».
              * Отображение номера аудитории, предмета и статуса.
            * 🗺️ **Интерактивный навигатор кампуса** (вкладка "Карта"):
              * Выбор корпусов: Большевиков 1, Большевиков 2, Мойка 61, Английский 3 (ВУЦ).
              * Поэтажные схемы со свайпами и масштабированием (pinch-to-zoom).
              * Поиск по аудиториям, кабинетам, столовой, деканатам.
              * Прямой переход из расписания на нужный этаж/корпус по клику на аудиторию!
            * ⚡ **Фоновая автоотметка** (Foreground Service с Android KeyStore шифрованием).
            * 🛡️ **100% Local-First & FOSS**: Никаких сторонних серверов, данные не покидают устройство.
          files: dist/Openbonch-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
