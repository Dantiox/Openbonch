name: Build Openbonch Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Openbonch APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compute Build Version
        id: versioning
        run: |
          BUILD_NUM="${{ github.run_number }}"
          VERSION="0.3.0.${BUILD_NUM}"
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=${{ env.VERSION }} --no-daemon

      - name: Locate and Rename APK for Distribution
        run: |
          mkdir -p dist
          find android -name "*debug.apk" -exec cp {} dist/Openbonch-debug.apk \;
          cp dist/Openbonch-debug.apk dist/Openbonch-${{ env.TAG }}.apk
          ls -la dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Openbonch-${{ env.TAG }}
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: ${{ env.TAG }}
          name: "Openbonch ${{ env.TAG }}"
          body: |
            ## Openbonch Android APK ${{ env.TAG }}

            ### 🚀 Что нового:
            * 🧭 **Точный коридорный навигатор кампуса**:
              * Полноценная маршрутизация по коридорам (векторный граф проходов строго по зданию, без резки стен).
              * Точное положение главного входа кампуса (Большевиков 22к1).
              * Маршруты от входа, от аудитории к аудитории, и быстрая опция «Из прошлой аудитории в следующую».
              * Многоэтажная навигация с авто-переходами по лестницам/лифтам и переходами 1 и 3 этажей между корпусами.
            * 🔄 **Фиксация меток при вращении**:
              * Номера аудиторий и иконки инфраструктуры (туалеты, лифты, лестницы) всегда остаются читаемыми и горизонтальными.
            * 📅 **Расписание по группам студентов**:
              * Подтягивание расписания группы из ЛК СПбГУТ при входе.
              * Возможность выбора и переключения учебных групп университета.
            * 🎨 **8 цветовых тем оформления**:
              * Светлая, Тёмная, Системная, OLED, Бонч Оранжевая, Киберпанк, Изумрудная, Индиго.
            * 🔘 **Полноценный функционал всех кнопок**:
              * Активные карточки пар с быстрым построением маршрута.
              * Плитки быстрого доступа («Расписание», «Карта», «Преподаватели», «Личный кабинет»).
              * Центрирование, зум, фильтры, уведомления и поиск.
          files: |
            dist/Openbonch-${{ env.TAG }}.apk
            dist/Openbonch-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
